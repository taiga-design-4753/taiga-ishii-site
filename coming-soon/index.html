<meta property="og:title" content="Taiga Ishii Racing">

<style>
:root{color-scheme:dark;--orange:#ff6a00;--black:#0b0b0b;--white:#fff;--gray:#a8a8a8}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--black);color:var(--white);font-family:"Helvetica Neue",Arial,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.6}
.wrap{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 16px;overflow:hidden}
.wrap::before{content:"";position:absolute;inset:0;background:url(/img/hero.jpg) center/cover no-repeat;opacity:.28}
.wrap>*{position:relative}
/* TIロゴ：パーツが組み上がる（CSSだけ） */
h1{width:min(84vw,620px);line-height:0}
h1 svg{display:block;width:100%;height:auto;overflow:visible}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sub{margin-top:18px;color:var(--gray);letter-spacing:.25em;font-size:12px}
h1 .lt,h1 .st,h1 .mk,h1 .tl,h1 .ul{transform-box:fill-box}
h1 .mk{animation:slidein .45s .2s cubic-bezier(.2,.8,.2,1) both}
h1 .st{transform-origin:left;animation:grow .35s .45s cubic-bezier(.2,.8,.2,1) both}
h1 .st2{animation-delay:.52s}h1 .st3{animation-delay:.59s}
h1 .tl{animation:pop .3s .55s ease-out both}
h1 .lt{animation:letter .35s cubic-bezier(.2,.8,.2,1) both}
h1 .ul{transform-origin:left;animation:grow .4s 1.4s cubic-bezier(.2,.8,.2,1) both}
.sub,.cs,.date{animation:pop .5s 1.6s ease-out both}
.date{animation-delay:1.75s}
@keyframes slidein{from{transform:translateX(-140%) skewX(-20deg);opacity:0}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
@keyframes letter{from{opacity:0;transform:translateX(-30px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.cs{margin-top:36px;font-size:clamp(18px,3.5vw,26px);font-weight:900;font-style:italic;letter-spacing:.3em;color:var(--orange)}
.date{margin-top:10px;color:var(--gray);letter-spacing:.2em;font-size:14px}
</style>
</head>

    <polygon class="st st3" points="3.6,82 147.6,82 147.3,83.5 3.3,83.5" fill="#FF6A00"/>
    <g class="tl" fill="#F5F7FA"><polygon points="29,17 103,17 102,22 28,22"/><polygon points="43,26 101,26 100,31 42,31"/><polygon points="63,31 78,31 68,82 53,82"/><polygon points="109,17 124,17 114,82 99,82"/></g>
    <g transform="translate(200,22) skewX(-11.31)">
      <g fill="#F5F7FA">

        <g class="lt" style="animation-delay:1.02s"><path transform="translate(68,0)" d="M0 0H7V40H0Z"/></g>
        <g class="lt" style="animation-delay:1.08s"><path transform="translate(81,0)" d="M28 0H6L0 6V40H28V18H14V25H21V33H7V7H28Z"/></g>
        <g class="lt" style="animation-delay:1.14s"><path transform="translate(115,0)" fill-rule="evenodd" d="M0 40V6L6 0H28V40H21V27H7V40Z M7 7H21V20H7Z"/></g>
      </g>
      <g fill="#2456D8">
        <g class="lt" style="animation-delay:1.2s"><path transform="translate(157,0)" d="M0 0H7V40H0Z"/></g>

</html>
