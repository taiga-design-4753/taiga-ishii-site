<style>
:root{color-scheme:dark;--orange:#ff6a00;--hi:rgba(255,106,0,.18);--hi2:rgba(255,106,0,.08);--black:#0b0b0b;--dark:#151515;--white:#fff;--gray:#a8a8a8}
*{box-sizing:border-box;margin:0;padding:0}

/* HERO：スクロールで写真がズームアウトし、文字が浮き上がって消える */
.hero-wrap{height:220vh;position:relative}
.hero{position:sticky;top:0;height:100vh;min-height:520px;overflow:hidden;display:flex;align-items:flex-end;padding:0 5vw 11vh}
.hero img{position:absolute;inset:0;z-index:0;transform:scale(1.25);will-change:transform}
/* 写真の暗さは filter ではなく黒い幕の濃さで変える（スマホでかくつかないように） */
.hero .shade{position:absolute;inset:0;z-index:0;background:#000;opacity:.4;will-change:opacity;pointer-events:none}
/* スマホのトップ写真は、くっきりしていてヘルメットが中央に来る p2 を使う（PCは hero のまま） */
@media(max-width:720px){.hero img{object-position:60% 50%!important}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--black) 0%,transparent 60%)}
.hero-text{position:relative;z-index:1;will-change:transform,opacity}
.hero h1{font-size:clamp(32px,7vw,72px);font-weight:900;letter-spacing:.08em;line-height:1.2}
.hero p{color:var(--gray);letter-spacing:.25em;font-size:13px;margin-top:10px}
/* HEROのTIロゴ：初回だけ黒い画面で組み上がり、写真の左下へ移る（transformとopacityだけで動かす） */
.hlogo{display:block;width:min(78vw,620px);line-height:0}
.hlogo svg{display:block;width:100%;height:auto;overflow:visible}
.hlogo .lt,.hlogo .st,.hlogo .mk,.hlogo .tl,.hlogo .ul{transform-box:fill-box}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero .hsub{margin-top:14px}
.hlogo .sweep{transform:translateX(-200px);animation:sweep 1s 1s ease-in-out both,sweep 1s 7s ease-in-out infinite}
@keyframes sweep{from{transform:translateX(-200px)}to{transform:translateX(560px)}}
.cover{display:none}
/* 対応ブラウザでは、トップ写真と大きな文字の動きをスクロールそのものに結びつける（JSを通さないのでスマホでもかくつかない） */
@supports (animation-timeline:view()){
html:not(.still) .hero-wrap{view-timeline:--hw block}
html:not(.still) .statement-wrap{view-timeline:--sw block}
html:not(.still) .hero picture{position:absolute;inset:0;z-index:0;will-change:transform;animation:hzoom linear both;animation-timeline:--hw;animation-range:contain 0% contain 100%}
html:not(.still) .hero img{transform:none;will-change:auto}
html.op:not(.still) .hero img{animation-name:zoomin2}
html:not(.still) .hero .shade{animation:hshade linear both;animation-timeline:--hw;animation-range:contain 0% contain 100%}
html:not(.still) .hero-text{animation:htext linear both;animation-timeline:--hw;animation-range:contain 30% contain 80%}
html:not(.still) .statement span{transition:none;animation:wlit linear both;animation-timeline:--sw;animation-range:contain var(--a) contain var(--b)}
}
@keyframes hzoom{from{transform:scale(1.25)}to{transform:scale(1)}}
@keyframes zoomin2{from{transform:scale(1.16)}}
@keyframes hshade{from{opacity:.4}to{opacity:.7}}
@keyframes htext{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-80px)}}
@keyframes wlit{from{opacity:.15}to{opacity:1}}
html.op .cover{display:block;position:absolute;z-index:3;top:0;bottom:0;left:-30%;width:160%;background:var(--black);transform:skewX(-14deg);animation:wipe .8s 1.9s cubic-bezier(.65,0,.25,1) forwards;pointer-events:none}
html.op .cover::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--orange);transform:scaleX(0);transform-origin:left;animation:grow .5s cubic-bezier(.7,0,.2,1) forwards,fade .3s .5s forwards}
html.op .hero-text{z-index:4}
html.op header,html.op .hint{animation:fadein .5s 2.4s both}
html.op .hero img{animation:zoomin 1.6s 1.9s cubic-bezier(.2,.8,.2,1) both}
html.op .hlogo svg{transform-origin:0 0;animation:toplace .8s 1.9s cubic-bezier(.65,0,.2,1) both}
html.op .hlogo .mk{animation:slidein .45s .35s cubic-bezier(.2,.8,.2,1) both}
html.op .hlogo .st{transform-origin:left;animation:grow .35s .6s cubic-bezier(.2,.8,.2,1) both}
html.op .hlogo .st2{animation-delay:.67s}html.op .hlogo .st3{animation-delay:.74s}
html.op .hlogo .tl{animation:tipop .3s .7s ease-out both}
html.op .hlogo .lt{animation:letter .35s cubic-bezier(.2,.8,.2,1) both}
html.op .hlogo .ul{transform-origin:left;animation:grow .4s 1.55s cubic-bezier(.2,.8,.2,1) both}
html.op .hsub{animation:fadein .5s 2.6s both}
html.op .hlogo .sweep{animation-delay:2.9s,7s}
html.skip .cover{display:none!important}
html.skip header,html.skip .hint,html.skip .hero img,html.skip .hsub,html.skip .hlogo svg,html.skip .hlogo :not(.sweep){animation:none!important}
@keyframes wipe{to{transform:translateX(110%) skewX(-14deg)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{to{opacity:0}}
@keyframes fadein{from{opacity:0}}
@keyframes zoomin{from{transform:scale(1.45)}}
@keyframes toplace{from{transform:translate(var(--dx),var(--dy)) scale(var(--s))}}
@keyframes slidein{from{transform:translateX(-140%) skewX(-20deg);opacity:0}}
@keyframes tipop{from{opacity:0;transform:translateY(8px)}}
@keyframes letter{from{opacity:0;transform:translateX(-30px)}}
.still .hlogo .sweep{animation:none}
.hint{position:absolute;z-index:1;left:50%;bottom:24px;transform:translateX(-50%);font-size:11px;letter-spacing:.3em;color:var(--gray);text-align:center}
.hint::after{content:"";display:block;width:1px;height:28px;background:var(--orange);margin:6px auto 0;animation:drop 1.6s ease-in-out infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* STATEMENT：スクロールに合わせて文字が順に光る */
.statement-wrap{height:260vh;position:relative}
.statement{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center;padding:0 7vw}
.statement p{font-size:clamp(30px,6vw,72px);font-weight:900;line-height:1.35;letter-spacing:.02em;max-width:1000px}
.statement span{display:inline-block;opacity:.15;transition:opacity .15s linear}
.statement em{font-style:italic;color:var(--orange)}
.statement b{font-weight:inherit}

section{padding:90px 5vw;max-width:1100px;margin:0 auto}
h2{font-size:clamp(26px,4vw,40px);font-weight:900;font-style:italic;letter-spacing:.1em;margin-bottom:36px}
h2::after{content:"";display:block;width:60px;height:4px;background:var(--orange);margin-top:10px;transform:scaleX(0);transform-origin:left;transition:transform .9s cubic-bezier(.2,.7,.2,1) .2s}
h2.in::after{transform:scaleX(1)}

/* ふわっと出てくる演出 */
.reveal{opacity:0;transform:translateY(48px);transition:opacity 1s cubic-bezier(.2,.7,.2,1),transform 1s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.band{position:relative;height:clamp(240px,40vw,560px);overflow:hidden;background:var(--dark)}
.band img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.08);transition:transform 1.8s cubic-bezier(.2,.7,.2,1)}
.band.reveal{transform:none}
.band.in img,.still .band img{transform:none}
/* スマホでは写真帯をはじめから表示し、拡大の動きもなくす（大きな写真の拡大・フェードがスクロール中のかくつきの元になるため） */
@media(max-width:720px){.band.reveal{opacity:1;transition:none}.band img{transform:none;transition:none}}

.profile{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.profile .photo{aspect-ratio:4/3;border-left:4px solid var(--orange);overflow:hidden}
.profile .photo img{transform:scale(1.15);transition:transform 1.6s cubic-bezier(.2,.7,.2,1)}
.profile .photo.in img{transform:scale(1)}
/* スマホではプロフィール写真もはじめから表示し、拡大の動きをなくす（写真帯と同じく、スクロール中のかくつきを防ぐ） */
@media(max-width:720px){.profile .photo.reveal{opacity:1;transform:none;transition:none}.profile .photo img{transform:none;transition:none}}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #2a2a2a;font-size:15px}
th{color:var(--orange);width:7em;font-weight:700;white-space:nowrap}
.note{color:var(--gray);font-size:13px;margin-top:12px}
.brandnote{margin-top:16px;line-height:1.8}.brandnote i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}.brandnote i+i{margin-right:10px}
.brandnote summary{cursor:pointer;list-style:none}.brandnote summary::-webkit-details-marker{display:none}.brandnote summary::after{content:"＋";color:var(--orange);margin-left:8px;font-weight:700}.brandnote[open] summary::after{content:"－"}.helmets{display:flex;gap:20px;margin-top:14px}.helmets figure{margin:0;text-align:center;font-size:12px}.helmets img{width:110px;height:110px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 6px;border:2px solid #2456D8}.helmets figure+figure img{border-color:var(--orange)}
/* CAREER：経歴の年表 */
.career-h{font-size:18px;font-weight:900;font-style:italic;letter-spacing:.15em;color:var(--orange);margin:56px 0 20px}
.career{list-style:none;position:relative;margin:0;padding:0 0 0 28px;max-width:820px}
.career::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:#2a2a2a}
.career li{position:relative;display:grid;grid-template-columns:5.5em 1fr;gap:16px;padding:10px 0;border-bottom:1px solid #1e1e1e}
.career li::before{content:"";position:absolute;left:-28px;top:17px;width:12px;height:12px;border-radius:50%;background:var(--black);border:2px solid var(--orange);box-sizing:border-box}
.career li:last-child::before{background:var(--orange)}
.career time{color:var(--orange);font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.career p{font-size:15px;line-height:1.6}
@media(max-width:720px){.career li{grid-template-columns:1fr;gap:2px}}
/* RESULTS */
.hl{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:48px}
.hl-card{position:relative;overflow:hidden;background:linear-gradient(135deg,#1d1d1d,#111);border:1px solid #2a2a2a;border-top:3px solid var(--orange);padding:24px 22px}
.hl-card small{color:var(--gray);font-size:12px;letter-spacing:.08em}
.hl-card strong{display:block;font-size:clamp(24px,2.8vw,32px);font-weight:900;font-style:italic;color:var(--orange);line-height:1.2;margin:6px 0 4px;letter-spacing:.02em}
.hl-card p{font-size:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.filters button{background:none;border:1px solid #444;color:var(--white);padding:6px 16px;font:inherit;font-weight:700;font-size:12px;line-height:1.6;letter-spacing:.12em;cursor:pointer;transition:background .2s,border-color .2s,color .2s}
.filters button:hover{border-color:var(--orange)}
.filters button.on{background:var(--orange);border-color:var(--orange);color:var(--black)}
.rhead,.rrow{display:grid;grid-template-columns:64px 1fr 64px 20px 84px 52px;align-items:center;gap:12px}
.rhead{font-size:11px;color:var(--gray);letter-spacing:.15em;padding:0 16px 8px;border-bottom:1px solid #2a2a2a}
.ryear{font-size:22px;font-weight:900;font-style:italic;color:var(--orange);letter-spacing:.08em;margin:28px 0 8px}
.rrow{padding:14px 16px;border-bottom:1px solid #222;transition:background .2s}
.rrow:hover{background:#141414}
.rrow.win{background:linear-gradient(90deg,var(--hi),transparent 70%);border-left:3px solid var(--orange)}
.rrow.pod{background:linear-gradient(90deg,var(--hi2),transparent 70%)}
.rdate{color:var(--gray);font-size:14px;font-variant-numeric:tabular-nums}
.rrace{font-size:15px;line-height:1.5}
.rrace em{font-style:normal;color:var(--gray);font-size:13px;margin-left:8px;display:inline-block}
.rrace .note{display:block;color:var(--orange);font-size:12px;letter-spacing:.06em}
.tag{display:inline-block;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;padding:0 7px;margin-right:8px;border-radius:2px;vertical-align:1px}
.tag.f4{background:#fff;color:#000}.tag.fj{background:var(--orange);color:#000}.tag.sfj{border:1px solid var(--orange);color:var(--orange)}.tag.f110{border:1px solid #fff;color:#fff}
.rq,.rf{text-align:center;line-height:1.1}
.rq small,.rf small{display:block;font-size:10px;color:var(--gray);letter-spacing:.1em;margin-bottom:3px;font-weight:400}
.rq{font-size:18px;font-weight:700;color:#cfcfcf;font-variant-numeric:tabular-nums}
.rf{font-size:28px;font-weight:900;font-style:italic;font-variant-numeric:tabular-nums}
.rf small{font-style:normal}
.rf .i{font-size:13px}
.rrow.win .rf,.rrow.pod .rf{color:var(--orange)}
.arrow{color:#555;text-align:center}
.dl{font-size:13px;font-weight:700;color:var(--gray);text-align:right}
.dl.up{color:#3ccf7a}.dl.down{color:#ff5a5a}
.rrow[hidden],.ryear[hidden],.rhead[hidden],.rhint[hidden]{display:none}
.toreport{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:32px;padding:20px 24px;border:1px solid #333;border-left:4px solid var(--orange);color:var(--white);text-decoration:none;transition:background .25s,border-color .25s}
.toreport small{display:block;color:var(--orange);font-size:11px;font-weight:700;letter-spacing:.2em;margin-bottom:4px}
.toreport span{font-size:15px;line-height:1.6}
.toreport b{font-size:13px;letter-spacing:.08em;white-space:nowrap;padding:8px 18px;background:var(--orange);color:var(--black);transition:transform .25s}
.toreport:hover{background:#151515;border-color:var(--orange)}
.toreport:hover b{transform:translateX(4px)}
.rhint{color:var(--gray);font-size:13px;letter-spacing:.06em;padding:14px 0;border-top:1px solid #2a2a2a}
.rrow.pop,.ryear.pop{animation:pop .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.dns{font-size:20px;color:var(--gray)}
@media(max-width:720px){
 .hl{grid-template-columns:1fr;gap:10px;margin-bottom:32px}
 .rhead{display:none}
 .rrow{grid-template-columns:1fr auto auto auto 40px;grid-template-areas:"race race race race race" "date q arrow f dl";gap:6px 10px;padding:14px 12px}
 .rrow .rrace{grid-area:race}.rrow .rdate{grid-area:date}.rrow .rq{grid-area:q}.rrow .arrow{grid-area:arrow}.rrow .rf{grid-area:f;min-width:64px}.rrow .dl{grid-area:dl}
}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:var(--dark);padding:22px;border-top:3px solid var(--orange)}
.card small{color:var(--orange);letter-spacing:.15em}
.card h3{margin:4px 0 6px;font-size:18px}
.card p{color:var(--gray)}

/* GALLERY：グリッド。5.5秒ごとに3枚ずつ入れ替わる。カテゴリ切り替え・拡大表示つき */
.gallery-sec h2{margin-bottom:28px}
.gtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.gtabs button{background:none;border:1px solid #444;color:var(--white);padding:6px 14px;font:inherit;font-weight:700;font-size:12px;line-height:1.6;letter-spacing:.1em;cursor:pointer;transition:background-color .2s,border-color .2s,color .2s}
.gtabs button:hover{border-color:var(--orange)}
.gtabs button.on{background:var(--orange);border-color:var(--orange);color:var(--black)}
.gtabs em{font-style:normal;font-weight:400;opacity:.7;margin-left:5px}
.ggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ggrid .ph{all:unset;position:relative;display:block;aspect-ratio:3/2;overflow:hidden;background:var(--dark);cursor:zoom-in}
.ggrid .ph[hidden]{display:none}
.ggrid .ph:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.ggrid .ph img{position:absolute;inset:0;transition:opacity 1.4s ease,transform .6s}
.ggrid .ph img.fade{opacity:0}
.ggrid .ph:hover img{transform:scale(1.05)}
.gbar{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:24px}
.gbar .gplay{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid #444;background:var(--dark);color:var(--white);font-size:13px;letter-spacing:-1px;cursor:pointer;transition:background-color .2s,border-color .2s}
.gbar .gplay:hover{background:var(--orange);border-color:var(--orange);color:var(--black)}
.gbar .gall{background:none;border:1px solid var(--orange);color:var(--white);padding:10px 26px;font:inherit;font-weight:700;font-size:13px;line-height:1.6;letter-spacing:.12em;cursor:pointer;transition:background-color .2s,color .2s}
.gbar .gall:hover{background:var(--orange);color:var(--black)}
.gallery-sec.all .gplay{display:none}
.glb{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(56px + env(safe-area-inset-top,0px)) 12px calc(24px + env(safe-area-inset-bottom,0px))}
.glb[hidden]{display:none}
.glb img{max-width:100%;max-height:calc(100% - 64px);object-fit:contain;width:auto;height:auto}
.glb p{color:#ddd;font-size:13px;margin:10px 0 0;text-align:center}
.glb .cr{color:var(--gray);font-size:11px;margin-top:4px;text-decoration:underline;text-underline-offset:2px}.glb .cr:hover{color:#fff}.glb .cr[hidden]{display:none}
.glb button{position:absolute;width:44px;height:44px;border-radius:50%;border:1px solid #555;background:rgba(255,255,255,.08);color:#fff;font-size:18px;cursor:pointer}
.glb .x{top:calc(12px + env(safe-area-inset-top,0px));right:12px}.glb .p{left:12px;top:50%}.glb .n{right:12px;top:50%}

/* PARTNERS（2026-10-13）：ロゴは同じグレー1色で横に流れる帯。数が少なく枠に収まるときは中央で止める */
#partners .pt-thanks{color:var(--gray);font-size:15px;line-height:1.9;margin:-6px 0 36px}
.pt-band{position:relative;width:100vw;margin-left:calc(50% - 50vw);background:#1c1c1c;border-top:1px solid #262626;border-bottom:1px solid #262626}
.pt-view{overflow:hidden;margin:0 max(48px,calc(50% - 540px))}

    gsec.classList.toggle('all', showAll);
    gall.textContent = showAll ? '閉じる' : 'すべて見る（' + list.length + '枚）';
    gall.hidden = !showAll && list.length <= n;
  }
  function swap(){
    if (showAll || !gplaying || ghover || !gvisible || document.hidden || !glb.hidden || !queue.length) return;
    var idx = [];
    for (var s = 0; s < slots.length; s++) if (lastSlots.indexOf(s) < 0) idx.push(s);
    idx.sort(function(){ return Math.random() - .5; });
    idx = idx.slice(0, Math.min(3, queue.length)); lastSlots = idx;
    idx.forEach(function(s, k){
      var ni = queue.shift(); queue.push(slots[s]); slots[s] = ni;
      var g = gen;
      setTimeout(function(){ if (g === gen) setPh(phs[s], ni, true); }, k * 450);
    });
  }
  function gSetPlay(on){
    gplaying = on;
    gplay.innerHTML = on ? '&#10074;&#10074;' : '&#9654;';
    gplay.setAttribute('aria-label', on ? '自動の入れ替えを一時停止' : '自動の入れ替えを再開');
  }
  gplay.addEventListener('click', function(){ gSetPlay(!gplaying); });
  gall.addEventListener('click', function(){
    showAll = !showAll; gRender();
    if (!showAll) gsec.scrollIntoView({ behavior: still ? 'auto' : 'smooth' });
  });
  tabs.forEach(function(b){ b.addEventListener('click', function(){
    gcat = b.dataset.c; tabs.forEach(function(x){ x.classList.toggle('on', x === b); }); gRender();
  }); });
  grid.addEventListener('mouseenter', function(){ ghover = true; });
  grid.addEventListener('mouseleave', function(){ ghover = false; });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function(es){ gvisible = es[0].isIntersecting; }, { threshold: .3 }).observe(grid);
  } else { gvisible = true; }
  var lastN = slotCount();
  addEventListener('resize', function(){ if (slotCount() !== lastN) { lastN = slotCount(); gRender(); } });
  gSetPlay(gplaying); gRender();
  gtimer = setInterval(swap, 5500);

  // 拡大表示（左右ボタン・スワイプ・矢印キーでめくる）
  var glb = document.querySelector('.glb'), glbImg = glb.querySelector('img'), glbCap = glb.querySelector('p'), glbCr = glb.querySelector('.cr'), gcur = 0, glbFrom = null;
  function lbShow(){ var p = list[gcur]; glbImg.src = p.f; glbImg.alt = p.a; glbCap.textContent = p.a + '　' + (gcur + 1) + ' / ' + list.length; glbCr.hidden = !p.cr; glbCr.textContent = p.cr ? '出典：' + p.cr : ''; glbCr.href = p.cu || ''; }
  function lbStep(d){ gcur = (gcur + d + list.length) % list.length; lbShow(); }
  function lbClose(){ glb.hidden = true; document.body.style.overflow = ''; if (glbFrom) glbFrom.focus(); }
  grid.addEventListener('click', function(e){
    var b = e.target.closest('.ph'); if (!b) return;
    gcur = +b.dataset.i; glbFrom = b; lbShow(); glb.hidden = false; document.body.style.overflow = 'hidden'; glb.querySelector('.x').focus();
  });
  glb.addEventListener('click', function(e){
    if (e.target.closest('.n')) lbStep(1);
    else if (e.target.closest('.p')) lbStep(-1);
    else if (e.target.closest('.x') || e.target === glb) lbClose();
  });
  var glbX = null;
  glb.addEventListener('touchstart', function(e){ glbX = e.touches[0].clientX; }, { passive: true });
  glb.addEventListener('touchend', function(e){ if (glbX === null) return; var d = e.changedTouches[0].clientX - glbX; glbX = null; if (Math.abs(d) > 40) lbStep(d < 0 ? 1 : -1); });
  addEventListener('keydown', function(e){
    if (glb.hidden) return;
    if (e.key === 'Escape') lbClose(); else if (e.key === 'ArrowRight') lbStep(1); else if (e.key === 'ArrowLeft') lbStep(-1);
  });

  }
  if (document.querySelector('.filters')) {
  // リザルトの年切り替え（年ボタンで開く・同じボタンで閉じる）
  var current = null;
  function applyFilter(y){
    var i = 0;
    document.querySelectorAll('.rrow, .ryear').forEach(function(r){
      var show = r.dataset.y === y;
      r.hidden = !show;
      r.classList.remove('pop');
      if (show && !still) { void r.offsetWidth; r.style.animationDelay = Math.min(i++, 12) * 40 + 'ms'; r.classList.add('pop'); }
    });
    document.querySelector('.rhead').hidden = !y;
    document.querySelector('.rhint').hidden = !!y;
    document.documentElement.classList.toggle('blue', y === '2024' || y === '2025');
  }
  document.querySelectorAll('.filters button').forEach(function(b){
    b.addEventListener('click', function(){
      current = current === b.dataset.f ? null : b.dataset.f;
      document.querySelectorAll('.filters button').forEach(function(x){ x.classList.toggle('on', x.dataset.f === current); });
      applyFilter(current);
    });
  });
  // 最初は2026年を表示
  current = '2026';
  document.querySelector('.filters button[data-f="2026"]').classList.add('on');
  applyFilter(current);

  }
  if (still || !document.querySelector('.hero-wrap')) return;

  var heroWrap = document.querySelector('.hero-wrap');
  var heroImg = document.querySelector('.hero img');
  var heroText = document.querySelector('.hero-text');
  var hint = document.querySelector('.hint');
  var stWrap = document.querySelector('.statement-wrap');

  function clamp(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
  function progress(el){
    var r = el.getBoundingClientRect();
    var total = r.height - innerHeight;
    return total > 0 ? clamp(-r.top / total) : 0;
  }
  var heroShade = document.querySelector('.hero .shade');
  var lastP = -1, lastS = -1;
  // CSSでスクロールに結びつけられるブラウザでは、JSは SCROLL の表示だけを動かす
  var byCss = window.CSS && CSS.supports('animation-timeline: view()');
  if (byCss) {
    for (var w = 0; w < words.length; w++) {
      words[w].style.setProperty('--a', (w / words.length / 1.15 * 100) + '%');
      words[w].style.setProperty('--b', ((w + 1) / words.length / 1.15 * 100) + '%');
    }
  }
  // 値が変わったときだけ書き換える（画面外に出たあとは何もしない）
  function frame(){
    var p = progress(heroWrap);
    if (p !== lastP && byCss) {
      lastP = p;
      hint.style.opacity = 1 - clamp(p * 6);
    }
    if (p !== lastP) {
      lastP = p;
      heroImg.style.transform = 'scale(' + (1.25 - .25 * p) + ')';
      heroShade.style.opacity = .4 + .3 * p;
      var t = clamp((p - .3) / .5);
      heroText.style.opacity = 1 - t;
      heroText.style.transform = 'translateY(' + (-80 * t) + 'px)';
      hint.style.opacity = 1 - clamp(p * 6);
    }

    var s = (byCss || !stWrap) ? lastS : clamp(progress(stWrap) * 1.15);
    if (s !== lastS) {
      lastS = s;
      for (var i = 0; i < words.length; i++) {
        words[i].style.opacity = .15 + .85 * clamp(s * words.length - i);
      }
    }

    ticking = false;
  }
  var ticking = false;
  function onScroll(){ if (!ticking) { ticking = true; requestAnimationFrame(frame); } }
  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('resize', onScroll);
  frame();
})();
</script>
<script id="pt-js">
(function(){
  var d=document.documentElement;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.addEventListener('click',function(e){
    if(e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey) return;
    var a=e.target.closest&&e.target.closest('a'); if(!a||a.target==='_blank'||a.hasAttribute('download')) return;
    var u; try{u=new URL(a.href,location.href)}catch(x){return}
    if(u.origin!==location.origin) return;
    if(u.pathname===location.pathname&&u.search===location.search) return; // 同じページ内の移動はそのまま
    e.preventDefault();
    try{sessionStorage.setItem('ptx','1')}catch(x){}
    d.classList.remove('pt-in'); void d.offsetWidth; d.classList.add('pt-out'); // いったん素の状態に戻してから閉じる（2回目以降の移動で急に色が変わるのを防ぐ）
    setTimeout(function(){location.href=u.href},720);
  });
  // 入ってくる動きが終わったら目印を外しておく
  if(d.classList.contains('pt-in')) setTimeout(function(){if(!d.classList.contains('pt-out'))d.classList.remove('pt-in')},1300);
  // 「戻る」で帰ってきたときに帯が残らないように
  addEventListener('pageshow',function(e){if(e.persisted){d.classList.remove('pt-out');try{sessionStorage.removeItem('ptx')}catch(x){}}});
})();
</script>
