<style>
:root{color-scheme:dark;--orange:#ff6a00;--black:#0b0b0b;--dark:#151515;--white:#fff;--gray:#a8a8a8}
*{box-sizing:border-box;margin:0;padding:0}
body{word-break:auto-phrase;background:var(--black);color:var(--white);font-family:"Helvetica Neue",Arial,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.8;overflow-x:clip}
a{color:inherit;text-decoration:none}
header{position:fixed;top:0;padding-top:calc(14px + env(safe-area-inset-top,0px))!important;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:rgba(11,11,11,.7);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:2px solid var(--orange)}
.logo{display:block;line-height:0;flex:none}
.logo svg{height:34px;width:auto;display:block}
nav{display:flex;gap:20px;font-size:13px;letter-spacing:.1em}
nav a:hover,nav a.on{color:var(--orange)}
.head{max-width:760px;margin:0 auto;padding:150px 5vw 36px}
.head small{color:var(--orange);letter-spacing:.3em;font-size:12px;font-weight:700}
.head h1{font-size:clamp(40px,8vw,72px);font-weight:900;font-style:italic;letter-spacing:.08em;line-height:1.1;margin:6px 0 18px}
.head h1::after{content:"";display:block;width:60px;height:4px;background:var(--orange);margin-top:14px}
.head p{color:#ddd;font-size:15px}
main{max-width:760px;margin:0 auto;padding:0 5vw 100px}
/* フォーム */
form{display:grid;gap:26px}
.f label,.f legend{display:block;font-size:14px;font-weight:700;letter-spacing:.04em;margin-bottom:8px}
.f em{font-style:normal;font-size:11px;font-weight:700;padding:1px 7px;margin-left:8px;border-radius:2px;vertical-align:1px;background:var(--orange);color:#000}
.f em.opt{background:#333;color:#ccc}
fieldset{border:none}
input[type=text],input[type=email],textarea{width:100%;font:inherit;font-size:16px;color:var(--white);background:var(--dark);border:1px solid #3a3a3a;border-radius:6px;padding:13px 14px;transition:border-color .2s,box-shadow .2s}
textarea{min-height:190px;resize:vertical;line-height:1.7}
input:focus,textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,106,0,.25)}
::placeholder{color:#666}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.types label{margin:0;font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px;padding:14px 14px;background:var(--dark);border:1px solid #3a3a3a;border-radius:6px;cursor:pointer;transition:border-color .2s,background .2s}
.types input{accent-color:var(--orange);width:18px;height:18px;flex:none}
.types label:has(input:checked){border-color:var(--orange);background:rgba(255,106,0,.12)}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.agree input{accent-color:var(--orange);width:18px;height:18px;margin-top:4px;flex:none}
.agree a,.txt a{color:var(--orange);border-bottom:1px solid var(--orange)}
.hp{position:absolute;left:-9999px}
.send{justify-self:center;display:inline-flex;align-items:center;gap:12px;font:inherit;font-weight:900;font-size:16px;letter-spacing:.12em;color:#000;background:var(--orange);border:none;border-radius:999px;padding:16px 56px;cursor:pointer;transition:transform .25s,box-shadow .25s}
.send:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(255,106,0,.35)}
.note{color:var(--gray);font-size:13px;text-align:center}
/* お礼・ポリシー */
.txt h2{font-size:17px;font-weight:900;margin:34px 0 8px;padding-left:12px;border-left:4px solid var(--orange)}
.txt p,.txt li{font-size:15px;color:#ddd}
.txt ul{padding-left:1.4em}
.txt .date{margin-top:40px;color:var(--gray);font-size:13px}
.back{display:inline-flex;margin-top:36px;padding:14px 34px;border-radius:999px;background:var(--white);color:#000;font-weight:900;letter-spacing:.1em;font-size:14px}
footer{text-align:center;padding:30px;color:var(--gray);font-size:12px;border-top:1px solid #1f1f1f}
footer a{margin-left:14px}
footer a:hover{color:var(--orange)}
@media(max-width:720px){
 header{gap:12px}.logo svg{height:26px}
 nav{gap:12px;font-size:11px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(to right,#000 85%,transparent)}nav::-webkit-scrollbar{display:none}
 .head{padding-top:120px}
 .types{grid-template-columns:1fr}
 .send{width:100%;justify-content:center}
}
/* デザイン調整：ナビ・ボタンを押しやすく、操作の見え方をページ間でそろえる */
nav a{display:inline-flex;align-items:center;min-height:44px;white-space:nowrap}
nav a.on{color:var(--orange)}
.filters button,.gtabs button{min-height:44px}
.next a,.toreport b{display:inline-flex;align-items:center;min-height:44px}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
.reveal{transform:translateY(28px);transition-duration:.65s}
.reveal.in{transform:none}
::placeholder{color:#888}
footer a{text-decoration:underline;text-underline-offset:3px;transition:color .2s}
footer a:hover{color:var(--orange)}
/* 日英併記：英語の見出し・メニューの下に日本語を小さく添える */
.ja{display:block;font-size:13px;font-weight:700;font-style:normal;letter-spacing:.2em;opacity:.72;margin-top:4px;line-height:1.4}
h1 .ja{font-size:14px;margin-top:10px}
nav a{flex-direction:column;justify-content:center;line-height:1.1}
nav a .ja{font-size:9px;font-weight:500;letter-spacing:.05em;margin-top:3px;opacity:.65}
@media(max-width:720px){.ja{font-size:12px}nav a .ja{font-size:8px}}
</style>
</head>
